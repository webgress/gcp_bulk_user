name: Release go-binary

# Build and publish the cross-compiled Transfer Appliance status viewer.
#
# Triggers on either:
#   - pushing a tag matching `v*` (e.g. v0.1.0, v1.2.3) -- this both builds
#     and uploads the binaries to a GitHub Release
#   - manual `workflow_dispatch` for ad-hoc smoke tests (no upload)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create a Release and upload assets

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go-binary/go.sum

      - name: Run unit tests
        working-directory: go-binary
        run: go test ./...

      - name: Cross-compile all targets
        working-directory: go-binary
        run: make release

      - name: Verify built binaries
        working-directory: go-binary
        run: |
          ls -lh dist/
          # Sanity-check: --help must exit cleanly on the linux-amd64 build.
          ./dist/gcp-appliance-status-linux-amd64 --help

      - name: Generate SHA-256 checksums
        working-directory: go-binary/dist
        run: sha256sum * | tee SHA256SUMS

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Auto-derive a body from the tag's commit log up to the previous tag.
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            go-binary/dist/gcp-appliance-status-darwin-arm64
            go-binary/dist/gcp-appliance-status-darwin-amd64
            go-binary/dist/gcp-appliance-status-linux-amd64
            go-binary/dist/gcp-appliance-status-linux-arm64
            go-binary/dist/gcp-appliance-status-windows-amd64.exe
            go-binary/dist/SHA256SUMS

      - name: Upload artifacts (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gcp-appliance-status-${{ github.sha }}
          path: go-binary/dist/*
          if-no-files-found: error
          retention-days: 14
